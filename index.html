<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" id="fav" type="image/png">
<title>DEL'S HOTEL GRILL – Accounting & Operations System</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0c0a07;--panel:rgba(255,255,255,.05);--line:rgba(255,255,255,.1);--gold:#de9b2d;--gold2:#fcd573;--txt:#ece8f2;--mut:#a39a88;--red:#ff6b6b;--grn:#5fd39a;--amb:#ffb454}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,sans-serif;color:var(--txt);background:var(--bg);min-height:100vh;
}
h1,h2,h3{font-family:Fraunces,serif;margin:0}
.app{display:flex;min-height:100vh}
nav{width:240px;padding:20px 14px;border-right:1px solid var(--line);background:rgba(0,0,0,.35);backdrop-filter:blur(14px);position:sticky;top:0;height:100vh;overflow:auto;flex-shrink:0}
.brand{font-family:Fraunces,serif;font-size:19px;color:var(--gold2);padding:6px 10px 18px;line-height:1.2}
.brand small{display:block;font:500 11px Inter;color:var(--mut);letter-spacing:.12em;text-transform:uppercase;margin-top:4px}
nav button{display:flex;width:100%;align-items:center;gap:10px;background:none;border:0;color:var(--mut);padding:10px 12px;border-radius:10px;font:500 14px Inter;cursor:pointer;text-align:left}
nav button:hover{background:var(--panel);color:var(--txt)}
nav button.on{background:linear-gradient(90deg,rgba(212,175,55,.2),transparent);color:var(--gold2)}
main{flex:1;padding:26px 30px;min-width:0}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:20px}
.top h2{font-size:28px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px;backdrop-filter:blur(10px);margin-bottom:18px}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));margin-bottom:18px}
.kpi .l{color:var(--mut);font-size:12px;text-transform:uppercase;letter-spacing:.08em}
.kpi .v{font:700 26px Fraunces,serif;color:var(--gold2);margin-top:6px}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:left;color:var(--mut);font-weight:500;padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 10px;border-bottom:1px solid rgba(255,255,255,.05)}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
tr.tot td{font-weight:600;color:var(--gold2);border-top:1px solid var(--gold)}
.sc{overflow-x:auto}
button.b,a.b{background:linear-gradient(135deg,var(--gold),#bc7304);color:#1a1405;border:0;border-radius:10px;padding:9px 14px;font:600 13px Inter;cursor:pointer;text-decoration:none;display:inline-block}
button.g{background:var(--panel);color:var(--txt);border:1px solid var(--line);border-radius:10px;padding:8px 12px;font:500 13px Inter;cursor:pointer}
button.x{background:none;border:0;color:var(--red);cursor:pointer;font-size:13px}
.tabs{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
.tabs button{background:var(--panel);border:1px solid var(--line);color:var(--mut);padding:7px 14px;border-radius:99px;font:500 13px Inter;cursor:pointer}
.tabs button.on{color:#1a1405;background:var(--gold2);border-color:var(--gold2)}
.pill{padding:2px 9px;border-radius:99px;font-size:11.5px;font-weight:600}
.ok{background:rgba(95,211,154,.15);color:var(--grn)}.warn{background:rgba(255,180,84,.15);color:var(--amb)}.bad{background:rgba(255,107,107,.15);color:var(--red)}
.alert{background:rgba(255,180,84,.12);border:1px solid rgba(255,180,84,.4);color:var(--amb);border-radius:12px;padding:12px 14px;margin-bottom:16px;font-size:14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
dialog{background:#17120b;color:var(--txt);border:1px solid var(--gold);border-radius:16px;padding:22px;width:min(440px,92vw)}
dialog::backdrop{background:rgba(0,0,0,.6)}
label{display:block;font-size:12px;color:var(--mut);margin:10px 0 4px}
input,select,textarea{width:100%;background:rgba(255,255,255,.06);border:1px solid var(--line);color:var(--txt);border-radius:9px;padding:9px;font:14px Inter}
select option{background:#17120b}
.bars{display:flex;align-items:flex-end;gap:10px;height:150px}
.bars div{flex:1;background:linear-gradient(var(--gold2),#bc7304);border-radius:6px 6px 0 0;position:relative;min-height:2px}
.bars span{position:absolute;bottom:-20px;left:0;right:0;text-align:center;font-size:11px;color:var(--mut)}
.note{color:var(--mut);font-size:12.5px}
.menu{display:none}
@media(max-width:820px){nav{position:fixed;z-index:20;left:-260px;transition:.25s;width:240px}nav.open{left:0}.menu{display:inline-block}main{padding:18px 14px}}
@media print{nav,.noprint{display:none!important}body{background:#fff;color:#000}}

#login{position:fixed;inset:0;z-index:100;display:none;align-items:center;justify-content:center;padding:20px;overflow:auto;background:#0a0806;isolation:isolate}
#login::before,#login::after{content:"";position:absolute;z-index:-1;border-radius:50%;filter:blur(70px);pointer-events:none}
#login::before{width:62vmax;height:62vmax;left:-18vmax;top:-22vmax;background:radial-gradient(circle at 40% 40%,#bc7304 0%,rgba(188,115,4,.55) 35%,transparent 68%);animation:driftA 26s ease-in-out infinite alternate}
#login::after{width:58vmax;height:58vmax;right:-20vmax;bottom:-24vmax;background:radial-gradient(circle at 55% 55%,#de9b2d 0%,rgba(224,169,59,.5) 34%,transparent 68%);animation:driftB 30s ease-in-out infinite alternate}
#login .glow{position:absolute;z-index:-1;inset:0;pointer-events:none;background:radial-gradient(520px 360px at 78% 18%,rgba(252,213,115,.16),transparent 70%),radial-gradient(480px 340px at 18% 86%,rgba(150,70,20,.24),transparent 70%)}
#login .grain{position:absolute;z-index:-1;inset:0;pointer-events:none;opacity:.5;background:linear-gradient(180deg,rgba(10,8,6,0) 0%,rgba(10,8,6,.55) 100%)}
@keyframes driftA{to{transform:translate(9vmax,7vmax) scale(1.08)}}
@keyframes driftB{to{transform:translate(-8vmax,-6vmax) scale(1.1)}}
#login .box{position:relative;width:min(410px,100%);padding:38px 32px 28px;border-radius:26px;
background:linear-gradient(155deg,rgba(255,255,255,.10),rgba(255,255,255,.03) 50%,rgba(255,255,255,.06));
backdrop-filter:blur(26px) saturate(150%);-webkit-backdrop-filter:blur(26px) saturate(150%);
box-shadow:0 30px 80px -20px rgba(0,0,0,.7),inset 0 1px 0 rgba(255,255,255,.14);animation:rise .8s cubic-bezier(.2,.8,.2,1) both}
#login .box::before{content:"";position:absolute;inset:0;border-radius:inherit;padding:1px;pointer-events:none;
background:linear-gradient(145deg,rgba(255,236,170,.85),rgba(255,255,255,.08) 40%,rgba(222,155,45,.6) 100%);
-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0)}
@keyframes rise{from{opacity:0;transform:translateY(18px) scale(.985)}to{opacity:1;transform:none}}
#login .box.shake{animation:shake .45s cubic-bezier(.36,.07,.19,.97)}
@keyframes shake{10%,90%{transform:translateX(-2px)}20%,80%{transform:translateX(4px)}30%,50%,70%{transform:translateX(-7px)}40%,60%{transform:translateX(7px)}}
#login .mark{width:64px;height:64px;margin:0 auto 16px;border-radius:20px;display:grid;place-items:center;font:700 32px Fraunces,serif;color:#241a05;
background:linear-gradient(145deg,#fff2b8 0%,#e9c055 45%,#bc7304 100%);box-shadow:0 12px 30px -8px rgba(232,189,74,.65),inset 0 1px 0 rgba(255,255,255,.7),inset 0 -3px 6px rgba(120,80,0,.35)}
#login .brand{text-align:center;font:600 15px Fraunces,serif;color:var(--gold2);letter-spacing:.04em;padding:0}
#login .lg{display:block;width:200px;max-width:70%;margin:-6px auto 4px;filter:drop-shadow(0 10px 26px rgba(222,155,45,.35))}
#login h1{font:700 28px/1.15 Fraunces,serif;text-align:center;margin:8px 0 6px;color:#fff;letter-spacing:-.01em}
#login .sub{text-align:center;color:#c4bba8;font-size:14px;margin:0 0 24px}
#login label{font-size:13px;font-weight:500;color:#e0d8c6;margin:14px 0 6px}
#login .fld{position:relative}
#login .fld svg{position:absolute;left:14px;top:50%;width:18px;height:18px;transform:translateY(-50%);stroke:#a8a08f;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;pointer-events:none;transition:stroke .2s}
#login .fld input{height:48px;padding:0 44px 0 44px;border-radius:14px;font:500 15px Inter,sans-serif;color:#fff;background:rgba(12,9,6,.45);border:1px solid rgba(255,255,255,.14);transition:border-color .2s,box-shadow .2s,background .2s}
#login .fld input::placeholder{color:#867d6c}
#login .fld input:hover{border-color:rgba(255,255,255,.26)}
#login .fld input:focus{outline:none;border-color:var(--gold2);background:rgba(12,9,6,.62);box-shadow:0 0 0 4px rgba(243,215,122,.18)}
#login .fld:focus-within svg{stroke:var(--gold2)}
#login .fld input:-webkit-autofill{-webkit-text-fill-color:#fff;box-shadow:0 0 0 100px #1a140c inset;caret-color:#fff}
#login .eye{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:38px;height:38px;display:grid;place-items:center;background:none;border:0;border-radius:10px;cursor:pointer;color:#a8a08f}
#login .eye svg{position:static;transform:none;stroke:currentColor}
#login .eye:hover{color:#fff;background:rgba(255,255,255,.08)}
#login .eye:focus-visible{outline:2px solid var(--gold2);outline-offset:1px}
#login .eye .off{display:none}
#login .eye[aria-pressed="true"] .on{display:none}
#login .eye[aria-pressed="true"] .off{display:block}
#login .err{min-height:20px;margin-top:12px;text-align:center;color:#ff8f8f;font-size:13px;font-weight:500}
#login button.go{position:relative;overflow:hidden;width:100%;height:50px;margin-top:6px;border:0;border-radius:14px;cursor:pointer;font:600 15px Inter,sans-serif;color:#241a05;
background:linear-gradient(135deg,#fff2b8 0%,#e9c055 48%,#bc7304 100%);box-shadow:0 14px 30px -10px rgba(240,194,79,.7),inset 0 1px 0 rgba(255,255,255,.65);transition:transform .15s,box-shadow .2s,filter .2s}
#login button.go::after{content:"";position:absolute;inset:0;background:linear-gradient(105deg,transparent 35%,rgba(255,255,255,.55) 50%,transparent 65%);transform:translateX(-120%);transition:transform .7s}
#login button.go:hover{filter:brightness(1.05);box-shadow:0 18px 36px -10px rgba(240,194,79,.85),inset 0 1px 0 rgba(255,255,255,.65)}
#login button.go:hover::after{transform:translateX(120%)}
#login button.go:active{transform:scale(.985)}
#login button.go:focus-visible{outline:3px solid rgba(255,255,255,.85);outline-offset:3px}
#login button.go[disabled]{opacity:.75;cursor:progress}
#login .foot{margin:22px 0 0;text-align:center;font-size:12.5px;color:#8f8676}
@media(max-width:480px){#login .box{padding:32px 22px 24px;border-radius:22px}#login h1{font-size:26px}}
@media(prefers-reduced-motion:reduce){#login::before,#login::after,#login .box,#login .box.shake{animation:none}#login button.go::after{transition:none}}



nav .brand{text-align:center;padding:4px 6px 16px}nav .brand img{display:block;width:158px;max-width:100%;margin:0 auto 2px;filter:drop-shadow(0 6px 16px rgba(222,155,45,.3))}nav .brand small{letter-spacing:.04em;text-transform:none;font-size:12px}
nav details.ng{margin-top:10px}nav summary{cursor:pointer;list-style:none;color:var(--gold2);font:600 13px Inter;padding:8px 12px;border-radius:10px;display:flex;justify-content:space-between;align-items:center}
nav summary::-webkit-details-marker{display:none}nav summary::after{content:"▾";color:var(--mut);transition:.2s}nav details:not([open]) summary::after{transform:rotate(-90deg)}nav summary:hover{background:var(--panel)}
nav details button{padding-left:20px}textarea{resize:vertical;min-height:120px}
.bigt{font:700 clamp(40px,8vw,64px) Fraunces,serif;color:var(--gold2);font-variant-numeric:tabular-nums;margin:8px 0 2px}
.pill{border:0;cursor:pointer}.mc{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}.mc .card{margin:0}.mc p{color:var(--mut);font-size:13px;margin:6px 0 12px}
/* ---------- Live clock ---------- */
#actions:empty{display:none}
.topr{display:flex;align-items:center;gap:12px;flex-wrap:wrap;justify-content:flex-end}
.clock{display:flex;align-items:center;gap:11px;padding:8px 16px 8px 10px;border-radius:16px;border:1px solid var(--line);
background:linear-gradient(145deg,rgba(255,255,255,.10),rgba(255,255,255,.03));backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:inset 0 1px 0 rgba(255,255,255,.1)}
.clock .ck-ic{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;background:linear-gradient(145deg,#fff2b8,#e9c055 50%,#bc7304);box-shadow:0 6px 16px -6px rgba(232,189,74,.7)}
.clock .ck-ic svg{width:19px;height:19px;fill:none;stroke:#241a05;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.clock .ck-tx{display:flex;flex-direction:column;line-height:1.15}
.clock b{font:700 19px Fraunces,serif;color:var(--gold2);font-variant-numeric:tabular-nums;letter-spacing:.01em}
.clock small{color:var(--mut);font-size:12px;margin-top:2px}
@media(max-width:820px){.topr{width:100%;justify-content:space-between}.clock{padding:7px 12px 7px 8px}.clock b{font-size:17px}}

/* ---------- Dashboard gradient backdrop ---------- */
.app{position:relative;isolation:isolate;background:#0a0806}
.app::before,.app::after{content:"";position:fixed;z-index:-1;pointer-events:none;border-radius:50%}
.app::before{width:70vmax;height:70vmax;left:-20vmax;top:-26vmax;background:radial-gradient(circle at 45% 45%,rgba(188,115,4,.55) 0%,rgba(188,115,4,.22) 38%,transparent 68%);animation:appDriftA 32s ease-in-out infinite alternate}
.app::after{width:64vmax;height:64vmax;right:-22vmax;bottom:-28vmax;background:radial-gradient(circle at 55% 55%,rgba(232,175,60,.42) 0%,rgba(232,175,60,.16) 38%,transparent 68%);animation:appDriftB 36s ease-in-out infinite alternate}
.app>main{position:relative}
.app>main::before{content:"";position:fixed;z-index:-1;inset:0;pointer-events:none;background:radial-gradient(520px 380px at 82% 12%,rgba(252,213,115,.09),transparent 70%),radial-gradient(520px 380px at 30% 92%,rgba(150,70,20,.16),transparent 70%)}
@keyframes appDriftA{to{transform:translate(8vmax,6vmax) scale(1.08)}}
@keyframes appDriftB{to{transform:translate(-7vmax,-5vmax) scale(1.1)}}
@media(prefers-reduced-motion:reduce){.app::before,.app::after{animation:none}}
@media print{.app::before,.app::after,.app>main::before{display:none}.app{background:#fff}}

/* ---------- Photo wallpaper (login + sidebar) ---------- */
#login{background-color:#0a0806;background-image:var(--wall);background-size:cover;background-position:center 6%;background-repeat:no-repeat}
#login::before,#login::after{opacity:.5}
#login .grain{opacity:1;background:linear-gradient(180deg,rgba(10,8,6,.5) 0%,rgba(10,8,6,.62) 45%,rgba(10,8,6,.86) 100%)}
nav{background:linear-gradient(180deg,rgba(10,8,6,.97) 0,rgba(10,8,6,.93) 175px,rgba(10,8,6,0) 330px),linear-gradient(180deg,rgba(10,8,6,.74) 0%,rgba(10,8,6,.82) 40%,rgba(10,8,6,.93) 100%),var(--wall) 22% center/cover no-repeat;border-right:1px solid rgba(222,155,45,.28)}

/* ---------- Full-screen fixed wallpaper (dashboard) ---------- */
.app>main::before{background:radial-gradient(520px 380px at 82% 12%,rgba(252,213,115,.12),transparent 70%),linear-gradient(180deg,rgba(10,8,6,.74) 0%,rgba(10,8,6,.84) 55%,rgba(10,8,6,.92) 100%),var(--wall) center 6%/cover no-repeat}
nav{background:linear-gradient(180deg,rgba(10,8,6,.92) 0,rgba(10,8,6,.78) 45%,rgba(10,8,6,.68) 100%);backdrop-filter:blur(16px) saturate(120%);-webkit-backdrop-filter:blur(16px) saturate(120%)}
#login{background-attachment:fixed}

/* ---------- Login wallpaper: whole photo fitted to the screen ---------- */
#login{background-image:none;background-attachment:scroll}
#login::before{display:none}
#login .wallbg{position:absolute;inset:-60px;z-index:-1;pointer-events:none;background:var(--wall) center/cover no-repeat;filter:blur(30px) brightness(.62) saturate(1.1)}
#login .wallfit{position:absolute;z-index:-1;pointer-events:none;left:50%;top:50%;transform:translate(-50%,-50%);width:min(100vw,75vh);width:min(100vw,75dvh);aspect-ratio:1000/1333;
background:var(--wall) center/100% 100% no-repeat;
-webkit-mask-image:linear-gradient(90deg,transparent,#000 9%,#000 91%,transparent),linear-gradient(180deg,transparent,#000 6%,#000 94%,transparent);-webkit-mask-composite:source-in;
mask-image:linear-gradient(90deg,transparent,#000 9%,#000 91%,transparent),linear-gradient(180deg,transparent,#000 6%,#000 94%,transparent);mask-composite:intersect}
#login .grain{background:radial-gradient(ellipse 560px 480px at 50% 50%,rgba(10,8,6,.6),transparent 72%),linear-gradient(180deg,rgba(10,8,6,.32) 0%,rgba(10,8,6,.5) 60%,rgba(10,8,6,.78) 100%)}

/* ---------- Login wallpaper v2: full-bleed fit, sign kept in view on every screen ---------- */
#login .wallbg{display:none}
#login .wallfit{inset:0;left:0;top:0;transform:none;width:auto;aspect-ratio:auto;-webkit-mask:none;mask:none;background:var(--wall) center 14%/cover no-repeat}
@media (max-aspect-ratio:1/1){#login .wallfit{background-position:8% top}}
#login .grain{background:radial-gradient(ellipse 520px 440px at 50% 50%,rgba(10,8,6,.42),transparent 75%),linear-gradient(180deg,rgba(10,8,6,.28) 0%,rgba(10,8,6,.42) 55%,rgba(10,8,6,.72) 100%)}

/* ---------- Wallpaper fix: pinned to the screen, never scrolls away ---------- */
#login .wallfit,#login .glow,#login .grain,#login::after{position:fixed}
#login{overscroll-behavior:contain}
.app>main::before{background:radial-gradient(520px 380px at 82% 12%,rgba(252,213,115,.12),transparent 70%),linear-gradient(180deg,rgba(10,8,6,.62) 0%,rgba(10,8,6,.76) 55%,rgba(10,8,6,.9) 100%),var(--wall) center 14%/cover no-repeat}
nav{background:linear-gradient(180deg,rgba(10,8,6,.92) 0,rgba(10,8,6,.74) 45%,rgba(10,8,6,.64) 100%)}
@media (max-aspect-ratio:1/1){.app>main::before{background-position:8% top}}
</style>
</head>
<body>
<div id="login"><div class="wallbg"></div><div class="wallfit"></div><div class="glow"></div><div class="grain"></div>
<form class="box" id="lf" autocomplete="on" novalidate>
<img class="lg" alt="Del's Hotel Grill &amp; Restaurant">
<h1>Welcome back</h1>
<p class="sub">Sign in to the accounting and operations system.</p>
<label for="lu">Username</label>
<div class="fld"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 20c1.5-3.6 4.4-5.4 8-5.4s6.5 1.8 8 5.4"/></svg>
<input id="lu" name="username" autocomplete="username" placeholder="Enter your username" autocapitalize="none" spellcheck="false" required></div>
<label for="lp">Password</label>
<div class="fld"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4.5" y="10.5" width="15" height="10" rx="3"/><path d="M8 10.5V8a4 4 0 0 1 8 0v2.5"/></svg>
<input id="lp" name="password" type="password" autocomplete="current-password" placeholder="Enter your password" required>
<button type="button" class="eye" id="pt" aria-label="Show password" aria-pressed="false"><svg class="on" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.6-6.5 10-6.5S22 12 22 12s-3.6 6.5-10 6.5S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg><svg class="off" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 3l18 18"/><path d="M10.6 5.6A10 10 0 0 1 12 5.5c6.4 0 10 6.5 10 6.5a17 17 0 0 1-3.2 3.9M6.5 7.2C3.8 8.9 2 12 2 12s3.6 6.5 10 6.5c1.5 0 2.9-.3 4.1-.9"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg></button></div>
<div class="err" id="le" role="alert" aria-live="polite"></div>
<button class="go" id="lb" type="submit">Sign in</button>
<p class="foot">Authorized staff only</p>
</form></div>
<div class="app" id="appwrap" style="display:none">
<nav id="nav"></nav>
<main>
 <div class="top"><div class="row"><button class="g menu" onclick="nav.classList.toggle('open')">☰</button><h2 id="title"></h2></div><div class="topr noprint"><div class="clock" id="clock"><span class="ck-ic" aria-hidden="true"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.2 2"/></svg></span><span class="ck-tx"><b id="ck-t">--:--:--</b><small id="ck-d"></small></span></div><div class="row" id="actions"></div></div></div>
 <div id="view"></div>
</main>
</div>

const BRAND="DEL'S HOTEL GRILL";
const PH=n=>'₱'+(+n||0).toLocaleString('en-PH',{minimumFractionDigits:2,maximumFractionDigits:2});
const $=s=>document.querySelector(s);
const today=new Date();today.setHours(0,0,0,0);
const dd=s=>new Date(s+'T00:00:00');
const days=(a,b)=>Math.floor((a-b)/864e5);
const uid=()=>Math.random().toString(36).slice(2,9);

const SEED={sales:[],invoices:[],payables:[],expenses:[],assets:[],advances:[],fuel:[],trip:[],sto:[],mr:[],memos:[],employees:[],timelog:[],disb:[]};
let DB=JSON.parse(localStorage.getItem('dels_hotel_grill_db')||'null')||JSON.parse(JSON.stringify(SEED));
const save=()=>{try{localStorage.setItem('dels_hotel_grill_db',JSON.stringify(DB))}catch(e){}};
['fuel','trip','sto','mr','memos','employees','timelog','disb'].forEach(k=>{if(!Array.isArray(DB[k]))DB[k]=[]});
const ymd=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const esc=v=>String(v??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

const NAV=[['dash','◈','Dashboard'],['sales','₱','Sales & Invoice'],['ar','⇄','Accounts Receivable'],['ap','⏰','Payables'],['tax','%','VAT & Taxes'],['assets','▣','Assets'],['ca','✎','Cash Advances'],['fs','≡','Financial Statement'],['fuel','⛽','Fuel Requests'],['trip','🚗','Trip Tickets'],['sto','✈','Staff Travel Orders'],['emp','👥','All Employees'],['bio','🕒','Biometric Time Clock'],['mr','📋','Memorandum Receipts (MR)'],['memo','✉','Hotel Memo Templates'],['exp','🧾','Expenses']];
const NG=[['Accounting',['sales','exp','ar','ap','tax','assets','ca','fs']],['Fuel & Travel',['fuel','trip','sto']],['HR & Admin',['emp','bio','mr','memo']]],NGC={};
let page='dash',tab={ar:'invoices',assets:'inventory',tax:'vat',ca:'Employee'},salesFilter='All',fsYear=null;

function drawNav(){
 const bt=id=>{const n=NAV.find(x=>x[0]==id);return `<button class="${page==id?'on':''}" onclick="go('${id}')"><span>${n[1]}</span>${n[2]}</button>`};
 $('#nav').innerHTML=`<div class="brand"><img src="${LOGO}" alt="${BRAND}"><small>Accounting &amp; Operations</small></div>`+bt('dash')+
 NG.map(([g,ids])=>`<details class="ng" ${NGC[g]?'':'open'} ontoggle="NGC['${g}']=!this.open"><summary>${g}</summary>${ids.map(bt).join('')}</details>`).join('')+
 `<div style="padding:16px 12px;display:grid;gap:8px"><button class="g" onclick="changeCreds()">Change login</button><button class="g" onclick="logout()">Log out</button></div>`;
}
function go(p){page=p;nav.classList.remove('open');render()}
function resetData(){if(confirm('Permanently delete ALL records? This cannot be undone.')){DB=JSON.parse(JSON.stringify(SEED));save();render()}}

/* helpers */
const vatOf=a=>a/1.12*0.12, netOf=a=>a/1.12;
const sum=(arr,f)=>arr.reduce((s,x)=>s+f(x),0);
const yr=s=>+s.slice(0,4);
function csv(name,head,rows){
 const q=v=>'"'+String(v).replace(/"/g,'""')+'"';
 const t=[head,...rows].map(r=>r.map(q).join(',')).join('\n');
 const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+t],{type:'text/csv'}));a.download=name+'.csv';a.click();
}
function tbl(head,rows,numCols=[],foot){
 return `<div class="sc"><table><tr>${head.map((h,i)=>`<th class="${numCols.includes(i)?'n':''}">${h}</th>`).join('')}</tr>`+
 (rows.length?rows.map(r=>`<tr>${r.map((c,i)=>`<td class="${numCols.includes(i)?'n':''}">${c}</td>`).join('')}</tr>`).join(''):`<tr><td colspan="${head.length}" class="note">No records yet.</td></tr>`)+
 (foot?`<tr class="tot">${foot.map((c,i)=>`<td class="${numCols.includes(i)?'n':''}">${c}</td>`).join('')}</tr>`:'')+`</table></div>`;
}
function form(title,fields,onSave,vals={}){
 $('#frm').innerHTML=`<h3>${title}</h3>`+fields.map(f=>`<label>${f.l}</label>`+(f.t=='textarea'?`<textarea name="${f.k}" rows="7" required>${esc(vals[f.k]??f.d??'')}</textarea>`:f.o?`<select name="${f.k}">${f.o.map(o=>`<option ${vals[f.k]==o?'selected':''}>${o}</option>`).join('')}</select>`:`<input name="${f.k}" type="${f.t||'text'}" step="any" required value="${vals[f.k]??f.d??''}">`)).join('')+
 `<div class="row" style="margin-top:18px;justify-content:flex-end"><button type="button" class="g" onclick="dlg.close()">Cancel</button><button class="b" value="ok">Save</button></div>`;
 $('#frm').onsubmit=e=>{const fd=Object.fromEntries(new FormData($('#frm')));onSave(fd);save();render()};
 dlg.showModal();
}
const del=(k,id)=>{if(confirm('Delete this record?')){DB[k]=DB[k].filter(x=>x.id!==id);save();render()}};
const addBtn=(label,fn)=>`<button class="b" onclick="${fn}">+ ${label}</button>`;
const setActions=h=>$('#actions').innerHTML=h;

/* ---------- Dashboard ---------- */
function vDash(){
 const y=today.getFullYear();
 const rev=sum(DB.sales.filter(s=>yr(s.date)==y),s=>netOf(s.amount));
 const exp=sum(DB.expenses.filter(s=>yr(s.date)==y),s=>s.amount);
 const ar=sum(DB.invoices.filter(i=>!i.paid),i=>i.amount);
 const ap=sum(DB.payables.filter(i=>!i.paid),i=>i.amount);
 const due=dueSoon();
 const byType={};DB.sales.filter(s=>yr(s.date)==y).forEach(s=>byType[s.type]=(byType[s.type]||0)+netOf(s.amount));
 const mx=Math.max(1,...Object.values(byType));
 setActions('');
 return (due.length?alertHtml(due):'')+`
 <div class="grid">
 <div class="card kpi"><div class="l">Net Sales ${y}</div><div class="v">${PH(rev)}</div></div>
 <div class="card kpi"><div class="l">Expenses ${y}</div><div class="v">${PH(exp)}</div></div>

function monthsUsed(a){const s=dd(a.date);return Math.max(0,Math.min(a.life,(today.getFullYear()-s.getFullYear())*12+today.getMonth()-s.getMonth()))}

 else h+=`<div class="card">${tbl(['Name of asset','Date purchase','Amount','Life span (mo.)','Monthly depreciation','Accumulated','Book value'],DB.assets.map(a=>{const m=a.amount/a.life,acc=m*monthsUsed(a);return[a.name,a.date,PH(a.amount),a.life,PH(m),PH(acc),PH(a.amount-acc)]}),[2,3,4,5,6],['Total','',PH(sum(DB.assets,a=>a.amount)),'',PH(sum(DB.assets,a=>a.amount/a.life)),PH(sum(DB.assets,a=>a.amount/a.life*monthsUsed(a))),PH(sum(DB.assets,a=>a.amount-a.amount/a.life*monthsUsed(a)))])}</div><p class="note">Straight-line method, no salvage value.</p>`;
 return h;
}

/* ---------- Financial Statement ---------- */
function stmt(y){
 const rev={};STYPES.forEach(t=>rev[t]=sum(DB.sales.filter(s=>yr(s.date)==y&&s.type==t),s=>netOf(s.amount)));
 const totalRev=sum(Object.values(rev),x=>x);
 const exp=sum(DB.expenses.filter(e=>yr(e.date)==y),e=>e.amount);
 const dep=sum(DB.assets,a=>{let t=0;for(let m=0;m<a.life;m++){const d=new Date(dd(a.date));d.setMonth(d.getMonth()+m+1);if(d.getFullYear()==y&&d<=today)t+=a.amount/a.life}return t});
 return {rev,totalRev,exp,dep,net:totalRev-exp-dep};
}
function fsRows(){
 const years=[...new Set([...DB.sales.map(s=>yr(s.date)),...DB.expenses.map(s=>yr(s.date)),today.getFullYear()])].sort();
 const S=years.map(stmt);
 const pct=(i,k)=>i==0?'–':(S[i-1][k]?((S[i][k]-S[i-1][k])/Math.abs(S[i-1][k])*100).toFixed(1)+'%':'–');
 const rows=[...STYPES.map(t=>['Revenue – '+t,...S.map(s=>s.rev[t])]),['Total Net Revenue',...S.map(s=>s.totalRev)],['Operating Expenses',...S.map(s=>s.exp)],['Depreciation',...S.map(s=>s.dep)],['Net Income',...S.map(s=>s.net)]];
 return {years,rows,S,pct};
}
function vFS(){
 const {years,rows,S}=fsRows();
 setActions(`<button class="g" onclick="exFS('csv')">Export CSV</button><button class="b" onclick="exFS('xls')">Export Excel</button><button class="g" onclick="window.print()">Print</button>`);
 return `<div class="card"><h3 style="margin-bottom:4px">Comparative Statement of Income (Annual)</h3><p class="note" style="margin-top:0">Amounts in PHP, net of VAT. Variance compares each year with the prior year.</p>
 <div class="sc"><table><tr><th>Line item</th>${years.map((y,i)=>`<th class="n">${y}</th>${i?`<th class="n">Δ ${y}</th>`:''}`).join('')}</tr>
 ${rows.map((r,ri)=>{const last=ri>=rows.length-4;return`<tr class="${ri==rows.length-1?'tot':''}"><td>${r[0]}</td>${years.map((y,i)=>`<td class="n">${PH(r[i+1])}</td>${i?`<td class="n">${r[i]?(((r[i+1]-r[i])/Math.abs(r[i]))*100).toFixed(1)+'%':'–'}</td>`:''}`).join('')}</tr>`}).join('')}</table></div></div>`;
}
function exFS(kind){

function pdoc(title,no,rows,sig){
 const w=window.open('','_blank');if(!w){alert('Allow pop-ups to print this document.');return}
 w.document.write(`<html><head><link rel="icon" id="fav" type="image/png">
<title>${esc(title)}</title><style>body{font:14px Arial,sans-serif;margin:40px;color:#111}h1{margin:0;font:700 22px Georgia,serif}h2{margin:18px 0 2px}.s{color:#555;font-size:12px}table{width:100%;border-collapse:collapse;margin:16px 0}td{border:1px solid #999;padding:8px;vertical-align:top}td:first-child{width:30%;background:#f3f3f3;font-weight:600}.sg{display:flex;gap:30px;margin-top:64px}.sg div{flex:1;border-top:1px solid #000;padding-top:4px;text-align:center;font-size:12px}</style></head><body><img src="${LOGO}" alt="${esc(BRAND)}" style="height:96px;display:block"><h2>${esc(title)}</h2><div class="s">No. ${esc(no)}</div><table>${rows.map(r=>`<tr><td>${esc(r[0])}</td><td>${esc(r[1]).replace(/\n/g,'<br>')}</td></tr>`).join('')}</table><div class="sg">${sig.map(x=>`<div>${esc(x)}</div>`).join('')}</div><script>onload=()=>print()<\/script></body></html>`);w.document.close();
}

/* ---------- Biometric time clock ---------- */
const tm=t=>t?new Date(t).toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit',second:'2-digit'}):'–';
const hrs=x=>x.tout?((x.tout-x.tin)/36e5).toFixed(2):'–';
function vBio(){
 setActions(`<button class="g" onclick="exTime()">Export CSV</button>`);
 const L=[...DB.timelog].reverse().slice(0,60);
 return `<div class="card" style="text-align:center"><h3>Biometric Time Clock</h3><div class="bigt" id="bt">--</div><div class="note">${new Date().toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric',year:'numeric'})}</div>
 <form class="row" style="justify-content:center;margin-top:16px" onsubmit="punch(event)"><input id="bn" placeholder="Scan or enter employee no." style="max-width:280px" autocomplete="off" required><button class="b">Punch in / out</button></form><div id="bm" style="min-height:22px;margin-top:12px;font-weight:600"></div></div>
 <div class="card"><h3 style="margin-bottom:10px">Time records</h3>${tbl(['Date','Employee No.','Name','Time in','Time out','Hours'],L.map(x=>[x.date,esc(x.no),esc(x.name),tm(x.tin),tm(x.tout),hrs(x)]))}</div>`;
}
function punch(e){
 e.preventDefault();const v=$('#bn').value.trim().toUpperCase(),emp=DB.employees.find(x=>x.no.toUpperCase()==v),m=$('#bm');
 if(!emp){m.style.color='var(--red)';m.textContent='Employee number not found. Register the employee first.';return}
 const now=Date.now(),open=DB.timelog.find(x=>x.no==emp.no&&x.date==ymd(new Date())&&!x.tout);
 if(open){open.tout=now;m.textContent=emp.name+' – Time out '+tm(now)+' ('+hrs(open)+' hrs)'}
 else{DB.timelog.push({id:uid(),no:emp.no,name:emp.name,date:ymd(new Date()),tin:now});m.textContent=emp.name+' – Time in '+tm(now)}
 m.style.color='var(--grn)';save();const msg=m.textContent;render();$('#bm').style.color='var(--grn)';$('#bm').textContent=msg;$('#bn').focus();
}
function exTime(){csv('time-records',['Date','Employee No.','Name','Time in','Time out','Hours'],DB.timelog.map(x=>[x.date,x.no,x.name,tm(x.tin),tm(x.tout),hrs(x)]))}

 <div class="card">${tbl(['Voucher no.','Date','Type','Payee','Particulars','Account','BIR selection','Gross','Tax withheld','Net payable',''],L.map(x=>{const jv=x.vtype=='Journal Voucher',w=ewtOf(x);return[esc(x.no||'–'),x.date,esc(vtOf(x)),esc(x.payee),esc(x.desc)+(jv?`<br><small>Dr ${esc(x.dr)} / Cr ${esc(x.cr)} · ${esc(x.ref)}</small>`:''),jv?'Liquidation: '+esc(x.liq):esc(x.acct||'–'),jv?'–':`<span class="pill ${x.with2307?'ok':'warn'}">${x.with2307?'2307 Issuance':'No Issuance'}</span>`,PH(jv?x.jvAmt:x.amount),jv?'–':PH(w),jv?'–':PH(x.amount-w),`<button class="g" onclick="prExp('${x.id}')">Print</button> <button class="x" onclick="del('expenses','${x.id}')">Delete</button>`]}),[7,8,9])}</div>`;

function newVoucher(t){
 const D=DF(),jv=t=='Journal Voucher';
 const f=jv?[D,{k:'desc',l:'Explanation / particulars'},{k:'liq',l:'For liquidation of',o:['Cash advance','Petty cash fund','Revolving fund','Other']},{k:'ref',l:'Reference no. (cash advance / voucher)'},{k:'dr',l:'Debit account',o:[...EACCT,'Other']},{k:'cr',l:'Credit account',o:['Cash advances','Petty cash fund','Revolving fund','Accounts payable','Other']},{k:'amount',l:'Amount (no cash / check involved)',t:'number'},{k:'asexp',l:'Count as expense in financial statements?',o:['Yes','No']}]
 :[D,{k:'payee',l:'Payee / supplier'},{k:'tin',l:'Payee TIN (N/A if none)',d:'N/A'},{k:'desc',l:'Particulars'},{k:'acct',l:'Expense account',o:EACCT},{k:'amount',l:'Gross amount',t:'number'},
  ...(t=='Petty Cash Voucher'?[EF('req','Requested by')]:t=='Revolving Voucher'?[{k:'fund',l:'Revolving fund / custodian'}]:[{k:'chk',l:'Check no.'},{k:'bank',l:'Bank'}]),
  {k:'bir',l:'Type of selection for BIR purpose',o:['2307 Issuance','No Issuance']},{k:'vat',l:'Payee VAT-registered?',o:['Yes','No']},{k:'atc',l:'Withholding tax (used when 2307 issuance)',o:ATC}];
 form('New '+t,f,v=>{
  const no=nextNo(VP[t],DB.expenses.filter(x=>x.vtype==t)),a=+v.amount;
  if(jv)DB.expenses.push({id:uid(),no,vtype:t,...v,payee:'–',amount:v.asexp=='Yes'?a:0,jvAmt:a});
  else{const r=/None/.test(v.atc)?0:parseFloat(v.atc.match(/(\d+)%/)[1]),w=v.bir=='2307 Issuance'&&r>0;DB.expenses.push({id:uid(),no,vtype:t,...v,amount:a,ewt:w?r:0,with2307:w})}
 });
}

 const x=DB.expenses.find(e=>e.id==id),t=vtOf(x);
 if(x.vtype=='Journal Voucher')return pdoc('Journal Voucher',x.no,[['Date',x.date],['Explanation',x.desc],['For liquidation of',x.liq],['Reference no.',x.ref],['Debit',x.dr],['Credit',x.cr],['Amount',PH(x.jvAmt)],['Note','No cash / check involved']],['Prepared by','Reviewed by','Approved by']);
 const w=ewtOf(x),base=x.vat=='Yes'?x.amount/1.12:x.amount,extra=x.chk?[['Check no. / bank',x.chk+' / '+x.bank]]:x.req?[['Requested by',x.req]]:x.fund?[['Revolving fund / custodian',x.fund]]:[];
 pdoc(t,x.no||'–',[['Date',x.date],['Payee',x.payee],['TIN',x.tin||'N/A'],['Particulars',x.desc],['Expense account',x.acct||'–'],...extra,['BIR selection',x.with2307?'2307 Issuance':'No Issuance'],['Gross amount',PH(x.amount)],['Tax base',PH(base)],['Withholding tax ('+(x.atc||'–')+')',PH(w)],['Net amount payable',PH(x.amount-w)]],t=='Check Disbursement'?['Prepared by','Approved by','Check signatory','Received by (payee)']:['Prepared by','Approved by','Received by (payee)']);
}

/* ---------- Login ---------- */
const AUTH_KEY='dels_hotel_grill_auth',SESS_KEY='dels_hotel_grill_session';
async function sha(t){
 try{if(crypto&&crypto.subtle){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('dhg|'+t));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}}catch(e){}
 let h=5381;for(const c of 'dhg|'+t)h=((h<<5)+h+c.charCodeAt(0))>>>0;return 'f'+h.toString(16);
}
async function getAuth(){
 try{const a=JSON.parse(localStorage.getItem(AUTH_KEY)||'null');if(a&&a.u&&a.p)return a}catch(e){}
 const a={u:'admin',p:await sha('malaine')};try{localStorage.setItem(AUTH_KEY,JSON.stringify(a))}catch(e){}return a;
}
const isIn=()=>{try{return sessionStorage.getItem(SESS_KEY)==='1'}catch(e){return window._in===true}};
const setIn=v=>{window._in=v;try{v?sessionStorage.setItem(SESS_KEY,'1'):sessionStorage.removeItem(SESS_KEY)}catch(e){}};
function showLogin(){$('#login').style.display='flex';$('#appwrap').style.display='none';$('#lf').classList.remove('shake');$('#lu').focus()}
function showApp(){$('#login').style.display='none';$('#appwrap').style.display='flex';render()}
$('#lf').onsubmit=async e=>{
 e.preventDefault();
 const a=await getAuth(),u=$('#lu').value.trim(),p=await sha($('#lp').value);
 if(u.toLowerCase()===a.u.toLowerCase()&&p===a.p){$('#le').textContent='';$('#lp').value='';$('#lp').type='password';$('#pt').setAttribute('aria-pressed','false');setIn(true);showApp()}
 else{$('#le').textContent='Incorrect username or password. Try again.';$('#lp').value='';$('#lp').focus();const bx=$('#lf');bx.classList.remove('shake');void bx.offsetWidth;bx.classList.add('shake')}
};
$('#pt').onclick=()=>{const p=$('#lp'),show=p.type==='password';p.type=show?'text':'password';$('#pt').setAttribute('aria-pressed',show);$('#pt').setAttribute('aria-label',show?'Hide password':'Show password');p.focus()};
$('#lu').oninput=$('#lp').oninput=()=>{$('#le').textContent=''};
document.documentElement.style.setProperty('--wall','url('+WALL+')');
document.querySelectorAll('img.lg').forEach(i=>i.src=LOGO);$('#fav').href=LOGO;
function tick(){const d=new Date();
 $('#ck-t').textContent=d.toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit',second:'2-digit',hour12:true});
 const _b=$('#bt');if(_b)_b.textContent=d.toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit',second:'2-digit'});
 $('#ck-d').textContent=d.toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric',year:'numeric'})}
tick();setInterval(tick,1000);
function logout(){setIn(false);page='dash';showLogin()}
function changeCreds(){
 form('Change login',[{k:'cur',l:'Current password',t:'password'},{k:'u',l:'New username'},{k:'p',l:'New password (min. 6 characters)',t:'password'}],()=>{},{});
 $('#frm').onsubmit=async e=>{
  e.preventDefault();const f=Object.fromEntries(new FormData($('#frm'))),a=await getAuth();
  if(await sha(f.cur)!==a.p){alert('Current password is incorrect.');return}
  if(f.p.length<6){alert('New password must be at least 6 characters.');return}
  try{localStorage.setItem(AUTH_KEY,JSON.stringify({u:f.u.trim(),p:await sha(f.p)}))}catch(x){}
  dlg.close();alert('Login updated.');
 };
}
(async()=>{await getAuth();isIn()?showApp():showLogin()})();
